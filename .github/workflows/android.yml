name: Android CI

on:
  push:
    branches: [ main, overworld-v2, combat-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Wire captured species into persistent roster
        if: github.event_name == 'push' && github.ref == 'refs/heads/combat-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/pathofthewild/game/OverworldScreen.kt')
          text = path.read_text()
          replacements = [
              (
                  '    val store = remember { OverworldProgressStore(context) }\n    val world = PrototypeOverworld.world',
                  '    val store = remember { OverworldProgressStore(context) }\n    val rosterStore = remember { MonsterRosterStore(context) }\n    val world = PrototypeOverworld.world',
              ),
              (
                  '    store.ensureCharacter(characterCreatedAtEpochMs)\n\n    var position',
                  '    store.ensureCharacter(characterCreatedAtEpochMs)\n    rosterStore.ensureCharacter(characterCreatedAtEpochMs)\n\n    var position',
              ),
              (
                  '            onVictory = { capturedEnemyIds ->\n                store.resolvePointOfInterest(encounterForBattle.id)',
                  '            onVictory = { capturedEnemyIds ->\n                capturedEnemyIds.forEach { speciesId -> rosterStore.capture(speciesId) }\n                store.resolvePointOfInterest(encounterForBattle.id)',
              ),
              (
                  '                    "${encounterForBattle.name} cleared by capture. Captured-monster persistence comes with the roster system."',
                  '                    "${encounterForBattle.name} cleared. Captured monster added to your roster."',
              ),
          ]
          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one source match, found {text.count(old)} for {old[:100]!r}')
              text = text.replace(old, new, 1)
              changed = True
          if changed:
              path.write_text(text)
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/OverworldScreen.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/OverworldScreen.kt
            git commit -m "Persist captured monsters from overworld battles"
            git push origin HEAD:combat-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
