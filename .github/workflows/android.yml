name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Apply calorie history UI migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/pathofthewild/game/MainActivity.kt')
          text = path.read_text()
          replacements = [
              (
                  '@Composable\nprivate fun CaloriesScreen(modifier: Modifier, store: GameStore) {\n    var entries by remember { mutableStateOf(store.foodEntriesToday()) }\n    var target by remember { mutableIntStateOf(store.calorieTarget()) }\n    var food by remember { mutableStateOf("") }\n    var caloriesText by remember { mutableStateOf("") }\n    var targetText by remember { mutableStateOf(target.toString()) }\n    val total = entries.sumOf { it.calories }',
                  '@Composable\nprivate fun CaloriesScreen(modifier: Modifier, store: GameStore) {\n    val context = androidx.compose.ui.platform.LocalContext.current\n    val historyStore = remember { CalorieHistoryStore(context) }\n    var entries by remember { mutableStateOf(store.foodEntriesToday()) }\n    var target by remember { mutableIntStateOf(store.calorieTarget()) }\n    var food by remember { mutableStateOf("") }\n    var caloriesText by remember { mutableStateOf("") }\n    var targetText by remember { mutableStateOf(target.toString()) }\n    var historyRange by remember { mutableStateOf(CalorieHistoryRange.SevenDays) }\n    var historyRevision by remember { mutableIntStateOf(0) }\n    val total = entries.sumOf { it.calories }\n\n    LaunchedEffect(total, entries.size) {\n        if (entries.isNotEmpty()) {\n            historyStore.record(LocalDate.now(), total)\n            historyRevision++\n        }\n    }\n    val history = remember(historyRange, historyRevision) { historyStore.history(historyRange) }\n    val historyAverage = if (history.isEmpty()) 0.0 else history.sumOf { it.calories }.toDouble() / history.size',
                  1,
              ),
              (
                  '                Text("$total / $target")\n                Text("Food history will be archived by date; the expanding history graph is a later milestone.")\n            }\n        }\n        item {\n            ResponsiveCard {\n                Text("Add food", fontWeight = FontWeight.Bold)',
                  '                Text("$total / $target")\n                Text("Daily totals are retained by date so the history view grows as you log food.")\n            }\n        }\n        item {\n            ResponsiveCard {\n                Text("Calorie history", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)\n                Spacer(Modifier.height(8.dp))\n                CalorieHistoryRangeSelector(selected = historyRange, onSelected = { historyRange = it })\n                Spacer(Modifier.height(10.dp))\n                if (history.isEmpty()) {\n                    Text("No logged days in this range yet.", color = MaterialTheme.colorScheme.onSurfaceVariant)\n                } else {\n                    CalorieHistoryChart(points = history, targetCalories = target)\n                    val firstDay = history.first().date\n                    val lastDay = history.last().date\n                    Text("${history.size} logged day(s) · ${historyAverage.toInt()} calorie average")\n                    Text("$firstDay to $lastDay · target line $target", color = MaterialTheme.colorScheme.onSurfaceVariant)\n                }\n            }\n        }\n        item {\n            ResponsiveCard {\n                Text("Add food", fontWeight = FontWeight.Bold)',
                  1,
              ),
          ]
          changed = False
          for old, new, expected in replacements:
              count = text.count(old)
              if count == 0 and new in text:
                  continue
              if count != expected:
                  raise SystemExit(f'Expected {expected} match(es), found {count}: {old[:110]!r}')
              text = text.replace(old, new)
              changed = True
          if changed:
              path.write_text(text)
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/MainActivity.kt
            git commit -m "Add calorie history ranges and chart"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
