name: Android CI

on:
  push:
    branches: [ main, party-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Wire roster formation into battles
        if: github.event_name == 'push' && github.ref == 'refs/heads/party-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app/src/main/java/com/pathofthewild/game/PrototypeBattleScreen.kt',
              '''internal fun PrototypeBattleScreen(\n    modifier: Modifier,\n    encounterName: String,\n    onVictory: (capturedEnemyIds: Set<String>) -> Unit,\n    onRetreat: () -> Unit\n) {''',
              '''internal fun PrototypeBattleScreen(\n    modifier: Modifier,\n    encounterName: String,\n    protagonistName: String = "Adventurer",\n    protagonistLevel: Int = 1,\n    activeMonsters: List<OwnedMonster> = emptyList(),\n    onVictory: (capturedEnemyIds: Set<String>, bondEligibleMonsterInstanceIds: Set<String>) -> Unit,\n    onRetreat: () -> Unit\n) {'''
          )
          replace_once(
              'app/src/main/java/com/pathofthewild/game/PrototypeBattleScreen.kt',
              '    val content = remember(encounterName) { PrototypeBattleFactory.create(encounterName) }',
              '''    val content = remember(encounterName, protagonistName, protagonistLevel, activeMonsters) {\n        RosterBattleFactory.create(encounterName, protagonistName, protagonistLevel, activeMonsters)\n    }'''
          )
          replace_once(
              'app/src/main/java/com/pathofthewild/game/PrototypeBattleScreen.kt',
              '                    onVictory = { onVictory(state.capturedEnemyIds) },',
              '''                    onVictory = {\n                        val bondEligible = CombatRules.bondEligibleMonsters(state.combatants)\n                            .mapTo(mutableSetOf()) { it.id }\n                        onVictory(state.capturedEnemyIds, bondEligible)\n                    },'''
          )

          replace_once(
              'app/src/main/java/com/pathofthewild/game/OverworldScreen.kt',
              '''internal fun OverworldScreen(\n    modifier: Modifier,\n    adventureAvailable: Long,\n    characterCreatedAtEpochMs: Long\n) {''',
              '''internal fun OverworldScreen(\n    modifier: Modifier,\n    adventureAvailable: Long,\n    characterCreatedAtEpochMs: Long,\n    protagonistName: String,\n    protagonistLevel: Int\n) {'''
          )
          replace_once(
              'app/src/main/java/com/pathofthewild/game/OverworldScreen.kt',
              '    var recenterRequest by remember { mutableIntStateOf(0) }\n\n    val currentSight',
              '''    var recenterRequest by remember { mutableIntStateOf(0) }\n    var rosterRevision by remember(characterCreatedAtEpochMs) { mutableIntStateOf(0) }\n\n    val activeParty = remember(characterCreatedAtEpochMs, rosterRevision) { rosterStore.activeParty() }\n    val currentSight'''
          )
          replace_once(
              'app/src/main/java/com/pathofthewild/game/OverworldScreen.kt',
              '''        PrototypeBattleScreen(\n            modifier = modifier,\n            encounterName = encounterForBattle.name,\n            onVictory = { capturedEnemyIds ->\n                capturedEnemyIds.forEach { speciesId -> rosterStore.capture(speciesId) }''',
              '''        PrototypeBattleScreen(\n            modifier = modifier,\n            encounterName = encounterForBattle.name,\n            protagonistName = protagonistName,\n            protagonistLevel = protagonistLevel,\n            activeMonsters = activeParty,\n            onVictory = { capturedEnemyIds, bondEligibleMonsterInstanceIds ->\n                capturedEnemyIds.forEach { speciesId -> rosterStore.capture(speciesId) }\n                bondEligibleMonsterInstanceIds.forEach { instanceId -> rosterStore.addBond(instanceId, 10) }\n                rosterRevision++'''
          )
          replace_once(
              'app/src/main/java/com/pathofthewild/game/OverworldScreen.kt',
              '                    "${encounterForBattle.name} cleared. Captured monster added to your roster."',
              '                    "${encounterForBattle.name} cleared. Captured monster added to reserve; conscious companions gained Bond."'
          )
          replace_once(
              'app/src/main/java/com/pathofthewild/game/OverworldScreen.kt',
              '''        item {\n            OverworldCard {\n                Row(''',
              '''        item {\n            MonsterRosterPanel(\n                characterCreatedAtEpochMs = characterCreatedAtEpochMs,\n                protagonistLevel = protagonistLevel,\n                refreshKey = rosterRevision,\n                onFormationChanged = { rosterRevision++ }\n            )\n        }\n\n        item {\n            OverworldCard {\n                Row('''
          )

          replace_once(
              'app/src/main/java/com/pathofthewild/game/MainActivity.kt',
              '        Destination.Adventure -> OverworldScreen(modifier, adventureAvailable, profile.createdAtEpochMs)',
              '        Destination.Adventure -> OverworldScreen(modifier, adventureAvailable, profile.createdAtEpochMs, profile.name, levelProgress.level)'
          )
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/PrototypeBattleScreen.kt app/src/main/java/com/pathofthewild/game/OverworldScreen.kt app/src/main/java/com/pathofthewild/game/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/PrototypeBattleScreen.kt app/src/main/java/com/pathofthewild/game/OverworldScreen.kt app/src/main/java/com/pathofthewild/game/MainActivity.kt
            git commit -m "Use captured roster and formation in battles"
            git push origin HEAD:party-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
