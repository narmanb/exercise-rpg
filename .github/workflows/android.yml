name: Android CI

on:
  push:
    branches: [ main, momentum-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Connect Momentum loop
        if: github.event_name == 'push' && github.ref == 'refs/heads/momentum-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/com/pathofthewild/game/MainActivity.kt')
          main = main_path.read_text().splitlines()

          if not any('fun spendMomentum(' in line for line in main):
              anchor = next(i for i, line in enumerate(main) if 'val adventureAvailable = max(' in line)
              additions = [
                  '    val momentumAvailable = rewardLedger.momentumAvailable',
                  '',
                  '    fun spendMomentum(amount: Long): Boolean {',
                  '        return when (val result = MomentumRules.spend(rewardLedger, amount)) {',
                  '            is MomentumSpendResult.Rejected -> false',
                  '            is MomentumSpendResult.Success -> {',
                  '                rewardLedger = result.state',
                  '                fitnessStore.saveRewardLedger(result.state)',
                  '                true',
                  '            }',
                  '        }',
                  '    }',
              ]
              main[anchor + 1:anchor + 1] = additions

          if not any('momentumAvailable = momentumAvailable' in line for line in main):
              indexes = [i for i, line in enumerate(main) if line.strip() == 'adventureAvailable = adventureAvailable,']
              for index in reversed(indexes):
                  main[index + 1:index + 1] = [
                      '                        momentumAvailable = momentumAvailable,',
                      '                        onSpendMomentum = ::spendMomentum,',
                  ]

          destination_start = next(i for i, line in enumerate(main) if line.strip() == 'private fun DestinationContent(')
          destination_adventure = next(i for i in range(destination_start, destination_start + 30) if main[i].strip() == 'adventureAvailable: Long,')
          if 'momentumAvailable:' not in '\n'.join(main[destination_start:destination_start + 35]):
              main[destination_adventure + 1:destination_adventure + 1] = [
                  '    momentumAvailable: Long,',
                  '    onSpendMomentum: (Long) -> Boolean,',
              ]

          for i, line in enumerate(main):
              if 'Destination.Home -> HomeScreen(' in line and 'momentumAvailable' not in line:
                  main[i] = '        Destination.Home -> HomeScreen(modifier, profile, eligibleSteps, walkingXp, levelProgress, adventureAvailable, momentumAvailable, store)'
              if 'Destination.Adventure -> OverworldScreen(' in line and 'momentumAvailable' not in line:
                  main[i] = '        Destination.Adventure -> OverworldScreen(modifier, adventureAvailable, profile.createdAtEpochMs, profile.name, levelProgress.level, momentumAvailable, onSpendMomentum)'

          home_start = next(i for i, line in enumerate(main) if line.strip() == 'private fun HomeScreen(')
          home_adventure = next(i for i in range(home_start, home_start + 20) if main[i].strip() == 'adventureAvailable: Long,')
          if 'momentumAvailable:' not in '\n'.join(main[home_start:home_start + 25]):
              main[home_adventure + 1:home_adventure + 1] = ['    momentumAvailable: Long,']

          if not any('Momentum available:' in line for line in main):
              reward_text = next(i for i, line in enumerate(main) if 'Prototype balance: 1 Adventure Point per 500 eligible steps' in line)
              main[reward_text] = '                Text("Prototype balance: 1 Adventure Point and 1 Momentum per 500 eligible steps, plus 1 XP per 100 eligible steps. Values will be tuned later.")'
              main[reward_text + 1:reward_text + 1] = [
                  '                Text("Momentum available: $momentumAvailable", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold)'
              ]

          main_path.write_text('\n'.join(main) + '\n')

          overworld_path = Path('app/src/main/java/com/pathofthewild/game/OverworldScreen.kt')
          overworld = overworld_path.read_text().splitlines()

          signature_start = next(i for i, line in enumerate(overworld) if line.strip() == 'internal fun OverworldScreen(')
          protagonist_level = next(i for i in range(signature_start, signature_start + 15) if overworld[i].strip() == 'protagonistLevel: Int')
          if not any('momentumAvailable:' in line for line in overworld[signature_start:signature_start + 20]):
              overworld[protagonist_level] = '    protagonistLevel: Int,'
              overworld[protagonist_level + 1:protagonist_level + 1] = [
                  '    momentumAvailable: Long = 0L,',
                  '    onSpendMomentum: (Long) -> Boolean = { false }',
              ]

          if not any('fun rallyWithMomentum(' in line for line in overworld):
              move_index = next(i for i, line in enumerate(overworld) if 'fun moveTo(point: GridPoint)' in line)
              rally_lines = [
                  '    fun rallyWithMomentum(): String {',
                  '        val currentParty = PlayerPartyFactory.currentCondition(',
                  '            protagonistName = protagonistName,',
                  '            protagonistLevel = protagonistLevel,',
                  '            activeMonsters = activeParty,',
                  '            savedVitals = partyVitals',
                  '        )',
                  '        return when (val plan = MomentumRules.rally(momentumAvailable, currentParty)) {',
                  '            is MomentumRallyResult.Rejected -> plan.reason',
                  '            is MomentumRallyResult.Success -> {',
                  '                if (!onSpendMomentum(plan.cost)) {',
                  '                    "Momentum balance changed before Rally could be used."',
                  '                } else {',
                  '                    partyVitals = partyVitalsStore.saveBattleResult(plan.party)',
                  '                    "Rally restored ${MomentumRules.RALLY_RECOVERY_PERCENT}% HP and MP to conscious party members."',
                  '                }',
                  '            }',
                  '        }',
                  '    }',
                  '',
              ]
              overworld[move_index:move_index] = rally_lines

          if not any('MomentumPanel(' in line for line in overworld):
              party_call = next(i for i, line in enumerate(overworld) if 'PartyStatusPanel(' in line)
              item_end = next(i for i in range(party_call, len(overworld)) if overworld[i] == '        }')
              panel_lines = [
                  '',
                  '        item {',
                  '            MomentumPanel(',
                  '                momentumAvailable = momentumAvailable,',
                  '                party = PlayerPartyFactory.currentCondition(',
                  '                    protagonistName = protagonistName,',
                  '                    protagonistLevel = protagonistLevel,',
                  '                    activeMonsters = activeParty,',
                  '                    savedVitals = partyVitals',
                  '                ),',
                  '                onRally = ::rallyWithMomentum',
                  '            )',
                  '        }',
              ]
              overworld[item_end + 1:item_end + 1] = panel_lines

          overworld_path.write_text('\n'.join(overworld) + '\n')
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/MainActivity.kt app/src/main/java/com/pathofthewild/game/OverworldScreen.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/MainActivity.kt app/src/main/java/com/pathofthewild/game/OverworldScreen.kt
            git commit -m "Connect exercise Momentum and field Rally"
            git push origin HEAD:momentum-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
