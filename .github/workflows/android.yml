name: Android CI

on:
  push:
    branches: [ main, overworld-v2, combat-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Connect overworld encounters to battle screen
        if: github.event_name == 'push' && github.ref == 'refs/heads/combat-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/pathofthewild/game/OverworldScreen.kt')
          text = path.read_text()
          marker = '''    LazyColumn(
        modifier = modifier.fillMaxSize(),'''
          insertion = '''    val encounterForBattle = activeEncounter
    if (encounterForBattle != null) {
        PrototypeBattleScreen(
            modifier = modifier,
            encounterName = encounterForBattle.name,
            onVictory = { capturedEnemyIds ->
                store.resolvePointOfInterest(encounterForBattle.id)
                resolvedPoiIds = store.resolvedPointOfInterestIds()
                message = if (capturedEnemyIds.isNotEmpty()) {
                    "${encounterForBattle.name} cleared by capture. Captured-monster persistence comes with the roster system."
                } else {
                    "${encounterForBattle.name} defeated."
                }
                activeEncounter = null
            },
            onRetreat = {
                message = "Retreated from ${encounterForBattle.name}."
                activeEncounter = null
            }
        )
        return
    }

    LazyColumn(
        modifier = modifier.fillMaxSize(),'''
          if insertion in text:
              raise SystemExit(0)
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one LazyColumn marker, found {text.count(marker)}')
          path.write_text(text.replace(marker, insertion, 1))
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/OverworldScreen.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/OverworldScreen.kt
            git commit -m "Launch portrait battles from overworld encounters"
            git push origin HEAD:combat-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
