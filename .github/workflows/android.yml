name: Android CI

on:
  push:
    branches: [ main, save-backup-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Connect save backup panel
        if: github.event_name == 'push' && github.ref == 'refs/heads/save-backup-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/pathofthewild/game/MainActivity.kt')
          lines = path.read_text().splitlines()
          if not any('SaveBackupPanel(' in line for line in lines):
              milestone = next((i for i, line in enumerate(lines) if 'Text("Current milestone"' in line), None)
              if milestone is None:
                  raise SystemExit('Current milestone anchor not found')
              item_start = milestone
              while item_start >= 0 and lines[item_start].strip() != 'item {':
                  item_start -= 1
              if item_start < 0:
                  raise SystemExit('Home item insertion point not found')
              insert = [
                  '        item {',
                  '            SaveBackupPanel(characterName = profile.name)',
                  '        }',
                  '',
              ]
              lines[item_start:item_start] = insert
              path.write_text('\n'.join(lines) + '\n')
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/MainActivity.kt
            git commit -m "Expose full save backup on Home"
            git push origin HEAD:save-backup-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
