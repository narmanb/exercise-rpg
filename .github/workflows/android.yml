name: Android CI

on:
  push:
    branches: [ main, party-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Remove obsolete encounter demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/party-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/pathofthewild/game/OverworldScreen.kt')
          text = path.read_text()

          text = text.replace('import androidx.compose.material3.AlertDialog\n', '')
          text = text.replace('import androidx.compose.material3.Button\n', '')
          text = text.replace('import androidx.compose.material3.TextButton\n', '')
          text = text.replace('    var encounterHp by remember { mutableIntStateOf(90) }\n', '')
          text = text.replace('                            encounterHp = 90\n', '')

          start_marker = '\n    activeEncounter?.let { encounter ->\n        AlertDialog('
          end_marker = '\n}\n\n@Composable\nprivate fun OverworldCard'
          start = text.find(start_marker)
          if start != -1:
              end = text.find(end_marker, start)
              if end == -1:
                  raise SystemExit('Could not find end of obsolete encounter dialog')
              text = text[:start] + text[end:]

          path.write_text(text)
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/OverworldScreen.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/OverworldScreen.kt
            git commit -m "Remove obsolete encounter dialog"
            git push origin HEAD:party-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
