name: Android CI

on:
  push:
    branches: [ main, party-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Connect towns and caves to local maps
        if: github.event_name == 'push' && github.ref == 'refs/heads/party-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/pathofthewild/game/OverworldScreen.kt')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one source match, found {count}: {old[:140]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '    var rosterRevision by remember(characterCreatedAtEpochMs) { mutableIntStateOf(0) }\n\n    val activeParty',
              '    var rosterRevision by remember(characterCreatedAtEpochMs) { mutableIntStateOf(0) }\n    var activeLocalAreaId by remember(characterCreatedAtEpochMs) { mutableStateOf<String?>(null) }\n\n    val activeParty'
          )

          replace_once(
              '                        PointOfInterestType.Town -> message = "Reached ${poi.name}. Town free-movement interiors come in a later map milestone."\n                        PointOfInterestType.Cave -> message = "Reached ${poi.name}. Dungeon interiors will use free movement once entered."',
              '''                        PointOfInterestType.Town,\n                        PointOfInterestType.Cave -> {\n                            val localArea = PrototypeLocalAreas.forOverworldPointOfInterest(poi.id)\n                            if (localArea != null) {\n                                activeLocalAreaId = poi.id\n                                message = "Entered ${localArea.name}. Local movement is free."\n                            } else {\n                                message = "Reached ${poi.name}. No local map is connected yet."\n                            }\n                        }'''
          )

          replace_once(
              '    val encounterForBattle = activeEncounter\n    if (encounterForBattle != null) {',
              '''    val activeLocalArea = activeLocalAreaId?.let(PrototypeLocalAreas::forOverworldPointOfInterest)\n    if (activeLocalArea != null) {\n        LocalAreaScreen(\n            modifier = modifier,\n            area = activeLocalArea,\n            onExit = {\n                message = "Returned to the Wilds from ${activeLocalArea.name}."\n                activeLocalAreaId = null\n            }\n        )\n        return\n    }\n\n    val encounterForBattle = activeEncounter\n    if (encounterForBattle != null) {'''
          )

          path.write_text(text)
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/OverworldScreen.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/OverworldScreen.kt
            git commit -m "Enter free-movement maps from towns and caves"
            git push origin HEAD:party-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
