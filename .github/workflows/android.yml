name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Apply durable fitness ledger migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/pathofthewild/game/MainActivity.kt')
          text = path.read_text()
          replacements = [
              (
                  '    val store = remember { GameStore(context) }\n    val scope = rememberCoroutineScope()\n\n    var profile by remember { mutableStateOf(store.loadProfile()) }\n    var destination by remember { mutableStateOf(Destination.Home) }',
                  '    val store = remember { GameStore(context) }\n    val scope = rememberCoroutineScope()\n\n    var profile by remember { mutableStateOf(store.loadProfile()) }\n    val fitnessStore = remember { FitnessLedgerStore(context) }\n    var stepLedger by remember { mutableStateOf(fitnessStore.loadStepLedger(profile?.sensorBaseline)) }\n    var rewardLedger by remember { mutableStateOf(fitnessStore.loadRewardLedger()) }\n    var destination by remember { mutableStateOf(Destination.Home) }',
                  1,
              ),
              (
                  '            } else {\n                0L\n            }\n            healthLoaded = true\n            healthError = null',
                  '            } else {\n                0L\n            }\n            if (p != null) {\n                val reconciled = StepReconciler.reconcileHealth(stepLedger, healthCharacterSteps)\n                if (reconciled != stepLedger) {\n                    stepLedger = reconciled\n                    fitnessStore.saveStepLedger(reconciled)\n                }\n            }\n            healthLoaded = true\n            healthError = null',
                  1,
              ),
              (
                  '    LaunchedEffect(profile?.createdAtEpochMs, rawSensorSteps) {\n        val p = profile ?: return@LaunchedEffect\n        if (p.sensorBaseline == null && rawSensorSteps >= 0f) {\n            store.setSensorBaseline(rawSensorSteps)\n            profile = store.loadProfile()\n        }\n    }',
                  '    LaunchedEffect(profile?.createdAtEpochMs, rawSensorSteps) {\n        val p = profile ?: return@LaunchedEffect\n        if (rawSensorSteps < 0f) return@LaunchedEffect\n        if (p.sensorBaseline == null) {\n            store.setSensorBaseline(rawSensorSteps)\n            profile = store.loadProfile()\n        }\n        val observed = StepReconciler.observeSensor(stepLedger, rawSensorSteps)\n        if (observed != stepLedger) {\n            stepLedger = observed\n            fitnessStore.saveStepLedger(observed)\n        }\n    }\n\n    LaunchedEffect(profile?.createdAtEpochMs, stepLedger.displayedSteps) {\n        if (profile == null) return@LaunchedEffect\n        val result = FitnessRewardEngine.applyEligibleSteps(rewardLedger, stepLedger.displayedSteps)\n        if (result.state != rewardLedger) {\n            rewardLedger = result.state\n            fitnessStore.saveRewardLedger(result.state)\n        }\n    }',
                  1,
              ),
              (
                  '    val eligibleSteps = max(healthCharacterSteps, sensorDelta)\n    val walkingXp = RpgProgression.walkingXpFromEligibleSteps(eligibleSteps)\n    val levelProgress = RpgProgression.progress(walkingXp)\n    val adventureEarned = eligibleSteps / FitnessRewardEngine.PROTOTYPE_STEPS_PER_ADVENTURE_POINT\n    val adventureAvailable = max(0L, 4L + adventureEarned - store.adventureSpent().toLong())',
                  '    val eligibleSteps = stepLedger.displayedSteps\n    val walkingXp = rewardLedger.totalWalkingXpGranted\n    val levelProgress = RpgProgression.progress(walkingXp)\n    val adventureEarned = rewardLedger.totalAdventurePointsGranted\n    val adventureAvailable = max(0L, 4L + adventureEarned - store.adventureSpent().toLong())',
                  1,
              ),
              (
                  '            onCreate = { name ->\n                profile = store.createProfile(\n                    name = name,\n                    healthBaseline = if (healthLoaded) healthTodaySteps else null,\n                    sensorBaseline = rawSensorSteps.takeIf { it >= 0f }\n                )\n                scope.launch { refreshHealth() }\n            }',
                  '            onCreate = { name ->\n                val sensorBaseline = rawSensorSteps.takeIf { it >= 0f }\n                profile = store.createProfile(\n                    name = name,\n                    healthBaseline = if (healthLoaded) healthTodaySteps else null,\n                    sensorBaseline = sensorBaseline\n                )\n                fitnessStore.resetForNewCharacter(sensorBaseline)\n                stepLedger = fitnessStore.loadStepLedger(sensorBaseline)\n                rewardLedger = fitnessStore.loadRewardLedger()\n                scope.launch { refreshHealth() }\n            }',
                  1,
              ),
              (
                  '                        sensorDelta = sensorDelta,\n                        store = store,',
                  '                        sensorDelta = sensorDelta,\n                        stepLedger = stepLedger,\n                        rewardLedger = rewardLedger,\n                        store = store,',
                  1,
              ),
              (
                  '                    sensorDelta = sensorDelta,\n                    store = store,',
                  '                    sensorDelta = sensorDelta,\n                    stepLedger = stepLedger,\n                    rewardLedger = rewardLedger,\n                    store = store,',
                  1,
              ),
              (
                  '    rawSensorSteps: Float,\n    sensorDelta: Long,\n    store: GameStore,',
                  '    rawSensorSteps: Float,\n    sensorDelta: Long,\n    stepLedger: StepLedgerState,\n    rewardLedger: FitnessRewardState,\n    store: GameStore,',
                  1,
              ),
              (
                  '            sensorDelta = sensorDelta,\n            eligibleSteps = eligibleSteps,\n            profile = profile,',
                  '            sensorDelta = sensorDelta,\n            eligibleSteps = eligibleSteps,\n            stepLedger = stepLedger,\n            rewardLedger = rewardLedger,\n            profile = profile,',
                  1,
              ),
              (
                  '    sensorDelta: Long,\n    eligibleSteps: Long,\n    profile: CharacterProfile,',
                  '    sensorDelta: Long,\n    eligibleSteps: Long,\n    stepLedger: StepLedgerState,\n    rewardLedger: FitnessRewardState,\n    profile: CharacterProfile,',
                  1,
              ),
              (
                  '                DiagnosticLine("Health Connect — since character", healthCharacterSteps.toString())\n                DiagnosticLine("Direct sensor raw since boot", if (rawSensorSteps >= 0) rawSensorSteps.toLong().toString() else "Waiting")\n                DiagnosticLine("Direct sensor delta from character baseline", sensorDelta.toString())',
                  '                DiagnosticLine("Health Connect — since character", healthCharacterSteps.toString())\n                DiagnosticLine("Ledger confirmed Health steps", stepLedger.confirmedHealthSteps.toString())\n                DiagnosticLine("Live unsynced sensor steps", stepLedger.liveUnconfirmedSteps.toString())\n                DiagnosticLine("Rewarded eligible-step watermark", rewardLedger.lastRewardedEligibleSteps.toString())\n                DiagnosticLine("Walking XP granted", rewardLedger.totalWalkingXpGranted.toString())\n                DiagnosticLine("Adventure Points granted", rewardLedger.totalAdventurePointsGranted.toString())\n                DiagnosticLine("Direct sensor raw since boot", if (rawSensorSteps >= 0) rawSensorSteps.toLong().toString() else "Waiting")\n                DiagnosticLine("Direct sensor delta from character baseline", sensorDelta.toString())\n                DiagnosticLine("Sensor reboot epoch", stepLedger.sensorEpoch.toString())',
                  1,
              ),
              (
                  '                Text("The authoritative long-term sync/reward ledger is the next tracking milestone; this build uses the character timestamp plus the live sensor baseline for safe early testing.", color = MaterialTheme.colorScheme.onSurfaceVariant)',
                  '                Text("The persistent reconciliation and reward ledgers are active. Health Connect confirmations consume matching live sensor steps instead of being added twice, and rewarded thresholds are stored separately so restarts cannot replay XP or Adventure Points.", color = MaterialTheme.colorScheme.onSurfaceVariant)',
                  1,
              ),
          ]
          changed = False
          for old, new, expected in replacements:
              count = text.count(old)
              if count == 0 and new in text:
                  continue
              if count != expected:
                  raise SystemExit(f'Expected {expected} match(es), found {count}: {old[:100]!r}')
              text = text.replace(old, new)
              changed = True
          if changed:
              path.write_text(text)
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/MainActivity.kt
            git commit -m "Persist and reconcile fitness rewards"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
