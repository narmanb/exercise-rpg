name: Android CI

on:
  push:
    branches: [ main, fitness-foreground-sync-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Connect foreground fitness lifecycle
        if: github.event_name == 'push' && github.ref == 'refs/heads/fitness-foreground-sync-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/pathofthewild/game/MainActivity.kt')
          lines = path.read_text().splitlines()

          if 'import android.content.ContextWrapper' not in lines:
              anchor = lines.index('import android.content.Context')
              lines.insert(anchor + 1, 'import android.content.ContextWrapper')

          if 'import androidx.lifecycle.Lifecycle' not in lines:
              anchor = lines.index('import androidx.health.connect.client.time.TimeRangeFilter')
              lines[anchor + 1:anchor + 1] = [
                  'import androidx.lifecycle.Lifecycle',
                  'import androidx.lifecycle.LifecycleEventObserver',
                  'import androidx.lifecycle.LifecycleOwner',
              ]

          if not any('var foregroundResumeGeneration by remember' in line for line in lines):
              anchor = next(i for i, line in enumerate(lines) if line.strip() == 'var hasStepSensor by remember { mutableStateOf(false) }')
              lines[anchor + 1:anchor + 1] = [
                  '    val lifecycleOwner = remember(context) {',
                  '        var current: Context? = context',
                  '        while (current is ContextWrapper && current !is LifecycleOwner) {',
                  '            current = current.baseContext',
                  '        }',
                  '        current as? LifecycleOwner',
                  '    }',
                  '    var isForeground by remember(lifecycleOwner) {',
                  '        mutableStateOf(',
                  '            lifecycleOwner?.lifecycle?.currentState?.isAtLeast(Lifecycle.State.STARTED) ?: true',
                  '        )',
                  '    }',
                  '    var foregroundResumeGeneration by remember { mutableIntStateOf(0) }',
              ]

          if not any(line.strip() == 'DisposableEffect(lifecycleOwner) {' for line in lines):
              anchor = next(i for i, line in enumerate(lines) if line.strip() == 'LaunchedEffect(Unit) {')
              lines[anchor:anchor] = [
                  '    DisposableEffect(lifecycleOwner) {',
                  '        if (lifecycleOwner == null) {',
                  '            isForeground = true',
                  '            onDispose { }',
                  '        } else {',
                  '            val observer = LifecycleEventObserver { _, event ->',
                  '                when (event) {',
                  '                    Lifecycle.Event.ON_START -> isForeground = true',
                  '                    Lifecycle.Event.ON_RESUME -> {',
                  '                        isForeground = true',
                  '                        activityPermissionGranted =',
                  '                            Build.VERSION.SDK_INT < Build.VERSION_CODES.Q ||',
                  '                                context.checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) == PackageManager.PERMISSION_GRANTED',
                  '                        foregroundResumeGeneration += 1',
                  '                    }',
                  '                    Lifecycle.Event.ON_STOP -> isForeground = false',
                  '                    else -> Unit',
                  '                }',
                  '            }',
                  '            lifecycleOwner.lifecycle.addObserver(observer)',
                  '            isForeground = lifecycleOwner.lifecycle.currentState.isAtLeast(Lifecycle.State.STARTED)',
                  '            onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }',
                  '        }',
                  '    }',
                  '',
              ]

          for i in range(len(lines) - 1):
              if lines[i].strip() == 'healthClient = HealthConnectClient.getOrCreate(context)' and lines[i + 1].strip() == 'refreshHealth()':
                  del lines[i + 1]
                  break

          if not any('LaunchedEffect(foregroundResumeGeneration, healthClient, healthSdkStatus)' in line for line in lines):
              anchor = next(i for i, line in enumerate(lines) if line.strip() == 'LaunchedEffect(profile?.createdAtEpochMs, healthPermissionGranted) {')
              lines[anchor:anchor] = [
                  '    LaunchedEffect(foregroundResumeGeneration, healthClient, healthSdkStatus) {',
                  '        if (',
                  '            FitnessForegroundPolicy.shouldRefreshHealth(',
                  '                isForeground = isForeground,',
                  '                healthSdkAvailable = healthSdkStatus == HealthConnectClient.SDK_AVAILABLE,',
                  '                healthClientAvailable = healthClient != null',
                  '            )',
                  '        ) {',
                  '            refreshHealth()',
                  '        }',
                  '    }',
                  '',
              ]

          for i, line in enumerate(lines):
              if line.strip() == 'DisposableEffect(activityPermissionGranted) {':
                  lines[i] = '    DisposableEffect(activityPermissionGranted, isForeground) {'
                  break

          if not any('FitnessForegroundPolicy.shouldRegisterStepSensor(' in line for line in lines):
              anchor = next(i for i, line in enumerate(lines) if line.strip() == 'if (activityPermissionGranted && stepSensor != null) {')
              lines[anchor:anchor + 1] = [
                  '        if (',
                  '            FitnessForegroundPolicy.shouldRegisterStepSensor(',
                  '                isForeground = isForeground,',
                  '                activityPermissionGranted = activityPermissionGranted,',
                  '                hasStepSensor = stepSensor != null',
                  '            ) && stepSensor != null',
                  '        ) {',
              ]

          path.write_text('\n'.join(lines) + '\n')
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/MainActivity.kt
            git commit -m "Follow foreground fitness lifecycle"
            git push origin HEAD:fitness-foreground-sync-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
