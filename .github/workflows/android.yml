name: Android CI

on:
  push:
    branches: [ main, local-events-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Add local-area re-entry action
        if: github.event_name == 'push' && github.ref == 'refs/heads/local-events-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/pathofthewild/game/OverworldScreen.kt')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:140]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    LazyColumn(\n        modifier = modifier.fillMaxSize(),''',
              '''    val currentLocalArea = world.pointOfInterestAt(position)\n        ?.let { PrototypeLocalAreas.forOverworldPointOfInterest(it.id) }\n\n    LazyColumn(\n        modifier = modifier.fillMaxSize(),'''
          )

          replace_once(
              '''                    OutlinedButton(onClick = { recenterRequest++ }) { Text("Center") }\n                }\n                Spacer(Modifier.height(10.dp))\n                WorldMapViewport(''',
              '''                    OutlinedButton(onClick = { recenterRequest++ }) { Text("Center") }\n                }\n                if (currentLocalArea != null) {\n                    Spacer(Modifier.height(8.dp))\n                    OutlinedButton(\n                        onClick = {\n                            activeLocalAreaId = currentLocalArea.id\n                            activeLocalPosition = currentLocalArea.start\n                        },\n                        modifier = Modifier.fillMaxWidth()\n                    ) {\n                        Text("Enter ${currentLocalArea.name}")\n                    }\n                }\n                Spacer(Modifier.height(10.dp))\n                WorldMapViewport('''
          )

          path.write_text(text)
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/OverworldScreen.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/OverworldScreen.kt
            git commit -m "Allow re-entry from current overworld location"
            git push origin HEAD:local-events-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
