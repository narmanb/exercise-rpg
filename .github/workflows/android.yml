name: Android CI

on:
  push:
    branches: [ main, activity-signal-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Connect activity recognition diagnostics
        if: github.event_name == 'push' && github.ref == 'refs/heads/activity-signal-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/pathofthewild/game/MainActivity.kt')
          lines = path.read_text().splitlines()

          if not any('val activitySignalStore = remember' in line for line in lines):
              destination = next(i for i, line in enumerate(lines) if 'var destination by remember' in line)
              lines[destination + 1:destination + 1] = [
                  '    val activitySignalStore = remember { ActivitySignalStore(context.applicationContext) }',
                  '    var activitySignal by remember(profile?.createdAtEpochMs) { mutableStateOf(activitySignalStore.load()) }',
                  '    var activitySamplingStatus by remember(profile?.createdAtEpochMs) { mutableStateOf("Waiting for activity permission") }',
              ]

          if not any('registerOnSharedPreferenceChangeListener(activitySignalListener)' in line for line in lines):
              sensor_effect = next(i for i, line in enumerate(lines) if line.strip() == 'DisposableEffect(activityPermissionGranted) {')
              block = [
                  '    DisposableEffect(profile?.createdAtEpochMs) {',
                  '        val activityPrefs = context.getSharedPreferences(SaveBackupRules.CORE_STORE, Context.MODE_PRIVATE)',
                  '        val activitySignalListener = android.content.SharedPreferences.OnSharedPreferenceChangeListener { _, _ ->',
                  '            activitySignal = activitySignalStore.load()',
                  '        }',
                  '        activitySignal = activitySignalStore.load()',
                  '        activityPrefs.registerOnSharedPreferenceChangeListener(activitySignalListener)',
                  '        onDispose { activityPrefs.unregisterOnSharedPreferenceChangeListener(activitySignalListener) }',
                  '    }',
                  '',
              ]
              lines[sensor_effect:sensor_effect] = block

          if not any('ActivitySignalRegistration.request(' in line for line in lines):
              sensor_effect = next(i for i, line in enumerate(lines) if line.strip() == 'DisposableEffect(activityPermissionGranted) {')
              block = [
                  '    LaunchedEffect(profile?.createdAtEpochMs, activityPermissionGranted) {',
                  '        if (profile == null) {',
                  '            activitySamplingStatus = "Waiting for character"',
                  '            return@LaunchedEffect',
                  '        }',
                  '        if (!activityPermissionGranted) {',
                  '            activitySamplingStatus = "Permission needed"',
                  '            return@LaunchedEffect',
                  '        }',
                  '        activitySamplingStatus = "Registering"',
                  '        ActivitySignalRegistration.request(',
                  '            context = context,',
                  '            onSuccess = { activitySamplingStatus = "Active — 60 s sampling" },',
                  '            onFailure = { error ->',
                  '                activitySamplingStatus = "Unavailable: ${error.message ?: error::class.java.simpleName}"',
                  '            }',
                  '        )',
                  '    }',
                  '',
              ]
              lines[sensor_effect:sensor_effect] = block

          if not any('val trackingMode = ActivitySignalRules.trackingMode(' in line for line in lines):
              momentum = next(i for i, line in enumerate(lines) if 'val momentumAvailable = rewardLedger.momentumAvailable' in line)
              lines[momentum + 1:momentum + 1] = [
                  '    val trackingMode = ActivitySignalRules.trackingMode(',
                  '        healthConnected = healthSdkStatus == HealthConnectClient.SDK_AVAILABLE && healthPermissionGranted,',
                  '        hasStepSensor = hasStepSensor,',
                  '        activityPermissionGranted = activityPermissionGranted',
                  '    )',
              ]

          creation_start = next(i for i, line in enumerate(lines) if line.strip() == 'private fun CharacterCreationScreen(')
          call_indexes = [
              i for i, line in enumerate(lines[:creation_start])
              if line.strip() == 'activityPermissionGranted = activityPermissionGranted,'
          ]
          for index in reversed(call_indexes):
              nearby = '\n'.join(lines[index:index + 7])
              if 'activitySamplingStatus = activitySamplingStatus' not in nearby:
                  lines[index + 1:index + 1] = [
                      '                        activitySignal = activitySignal,',
                      '                        activitySamplingStatus = activitySamplingStatus,',
                      '                        trackingMode = trackingMode,',
                  ]

          destination_start = next(i for i, line in enumerate(lines) if line.strip() == 'private fun DestinationContent(')
          destination_end = next(i for i in range(destination_start + 1, len(lines)) if lines[i].strip() == ') {')
          destination_signature = '\n'.join(lines[destination_start:destination_end + 1])
          if 'activitySignal: ActivitySignal?' not in destination_signature:
              permission_line = next(i for i in range(destination_start, destination_end) if lines[i].strip() == 'activityPermissionGranted: Boolean,')
              lines[permission_line + 1:permission_line + 1] = [
                  '    activitySignal: ActivitySignal?,',
                  '    activitySamplingStatus: String,',
                  '    trackingMode: StepTrackingMode,',
              ]

          destination_start = next(i for i, line in enumerate(lines) if line.strip() == 'private fun DestinationContent(')
          diagnostics_start = next(i for i in range(destination_start, len(lines)) if 'Destination.Diagnostics -> DiagnosticsScreen(' in lines[i])
          diagnostics_end = next(i for i in range(diagnostics_start, len(lines)) if lines[i].strip() == ')')
          diag_call_text = '\n'.join(lines[diagnostics_start:diagnostics_end + 1])
          if 'activitySignal = activitySignal' not in diag_call_text:
              permission_line = next(i for i in range(diagnostics_start, diagnostics_end) if lines[i].strip() == 'activityPermissionGranted = activityPermissionGranted,')
              lines[permission_line + 1:permission_line + 1] = [
                  '            activitySignal = activitySignal,',
                  '            activitySamplingStatus = activitySamplingStatus,',
                  '            trackingMode = trackingMode,',
              ]

          diagnostics_function = next(i for i, line in enumerate(lines) if line.strip() == 'private fun DiagnosticsScreen(')
          diagnostics_signature_end = next(i for i in range(diagnostics_function + 1, len(lines)) if lines[i].strip() == ') {')
          signature_text = '\n'.join(lines[diagnostics_function:diagnostics_signature_end + 1])
          if 'activitySignal: ActivitySignal?' not in signature_text:
              permission_line = next(i for i in range(diagnostics_function, diagnostics_signature_end) if lines[i].strip() == 'activityPermissionGranted: Boolean,')
              lines[permission_line + 1:permission_line + 1] = [
                  '    activitySignal: ActivitySignal?,',
                  '    activitySamplingStatus: String,',
                  '    trackingMode: StepTrackingMode,',
              ]

          if not any('DiagnosticLine("Current tracking mode"' in line for line in lines):
              diagnostics_function = next(i for i, line in enumerate(lines) if line.strip() == 'private fun DiagnosticsScreen(')
              final_steps = next(i for i in range(diagnostics_function, len(lines)) if 'DiagnosticLine("Final in-game eligible steps"' in lines[i])
              lines[final_steps + 1:final_steps + 1] = [
                  '                DiagnosticLine("Current tracking mode", trackingMode.label)',
              ]

          if not any('DiagnosticLine("Activity Recognition sampler"' in line for line in lines):
              diagnostics_function = next(i for i, line in enumerate(lines) if line.strip() == 'private fun DiagnosticsScreen(')
              permission = next(i for i in range(diagnostics_function, len(lines)) if 'DiagnosticLine("Activity Recognition permission"' in lines[i])
              lines[permission + 1:permission + 1] = [
                  '                DiagnosticLine("Activity Recognition sampler", activitySamplingStatus)',
              ]

          if not any('Text("Activity signal", fontWeight = FontWeight.Bold)' in line for line in lines):
              diagnostics_function = next(i for i, line in enumerate(lines) if line.strip() == 'private fun DiagnosticsScreen(')
              epoch_text = next(i for i in range(diagnostics_function, len(lines)) if 'Text("Character fitness epoch"' in lines[i])
              epoch_item = epoch_text
              while epoch_item >= diagnostics_function and lines[epoch_item].strip() != 'item {':
                  epoch_item -= 1
              activity_block = [
                  '        item {',
                  '            ResponsiveCard {',
                  '                Text("Activity signal", fontWeight = FontWeight.Bold)',
                  '                val signal = activitySignal',
                  '                if (signal == null) {',
                  '                    Text("Waiting for the first activity sample.", color = MaterialTheme.colorScheme.onSurfaceVariant)',
                  '                } else {',
                  '                    DiagnosticLine("Most probable activity", signal.kind.label)',
                  '                    DiagnosticLine("Confidence", "${signal.confidence}%")',
                  '                    DiagnosticLine("Signal age", ActivitySignalRules.age(signal, System.currentTimeMillis()).label)',
                  '                    DiagnosticLine("Observed", Instant.ofEpochMilli(signal.observedAtEpochMs).toString())',
                  '                }',
                  '                Text("Observation only — activity recognition does not reject or alter step rewards yet.", color = MaterialTheme.colorScheme.onSurfaceVariant)',
                  '            }',
                  '        }',
                  '',
              ]
              lines[epoch_item:epoch_item] = activity_block

          lines = [
              line.replace('Text("Sensor permission")', 'Text("Activity permission")')
                  .replace('Text("Step access")', 'Text("Activity access")')
              for line in lines
          ]

          path.write_text('\n'.join(lines) + '\n')
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/MainActivity.kt
            git commit -m "Show live activity recognition diagnostics"
            git push origin HEAD:activity-signal-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
