name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Apply training navigation migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/pathofthewild/game/MainActivity.kt')
          text = path.read_text()
          replacements = [
              (
                  '    Calories("Calories", "Food"),\n    Diagnostics("Diagnostics", "Debug")',
                  '    Calories("Calories", "Food"),\n    Training("Training", "Train"),\n    Diagnostics("Diagnostics", "Debug")',
                  1,
              ),
              (
                  '        val wide = maxWidth >= 600.dp\n        if (wide) {',
                  '        val wide = ResponsivePolicy.navigationMode(maxWidth.value) == NavigationMode.Rail\n        if (wide) {',
                  1,
              ),
              (
                  '        Destination.Calories -> CaloriesScreen(modifier, store)\n        Destination.Diagnostics -> DiagnosticsScreen(',
                  '        Destination.Calories -> CaloriesScreen(modifier, store)\n        Destination.Training -> WorkoutScreen(modifier)\n        Destination.Diagnostics -> DiagnosticsScreen(',
                  1,
              ),
              (
                  '        if (maxWidth >= 520.dp) {\n            Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {',
                  '        if (ResponsivePolicy.useTwoColumns(maxWidth.value)) {\n            Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {',
                  1,
              ),
              (
                  '                    if (maxWidth >= 420.dp) {\n                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {',
                  '                    if (ResponsivePolicy.useCompactActionRow(maxWidth.value)) {\n                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {',
                  1,
              ),
          ]
          changed = False
          for old, new, expected in replacements:
              count = text.count(old)
              if count == 0 and new in text:
                  continue
              if count != expected:
                  raise SystemExit(f'Expected {expected} match(es), found {count}: {old[:120]!r}')
              text = text.replace(old, new)
              changed = True
          if changed:
              path.write_text(text)
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/MainActivity.kt
            git commit -m "Add Training destination and shared responsive breakpoints"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
