name: Android CI

on:
  push:
    branches: [ main, step-detector-live-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Connect immediate step detector
        if: github.event_name == 'push' && github.ref == 'refs/heads/step-detector-live-v1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/pathofthewild/game/MainActivity.kt')
          text = path.read_text()

          def replace_exact(old, new, label, count=1):
              global text
              found = text.count(old)
              if found == 0 and new in text:
                  return
              if found != count:
                  raise SystemExit(f'{label}: expected {count} match(es), found {found}')
              text = text.replace(old, new, count)

          replace_exact(
              '    var rawSensorSteps by remember { mutableFloatStateOf(-1f) }\n    var hasStepSensor by remember { mutableStateOf(false) }\n',
              '    var rawSensorSteps by remember { mutableFloatStateOf(-1f) }\n    var hasStepSensor by remember { mutableStateOf(false) }\n    var hasStepDetector by remember { mutableStateOf(false) }\n    var detectorSessionSteps by remember(profile?.createdAtEpochMs) { mutableLongStateOf(0L) }\n    var lastDetectorStepEpochMs by remember(profile?.createdAtEpochMs) { mutableStateOf<Long?>(null) }\n',
              'detector state'
          )

          old_sensor = '\n'.join([
              '    DisposableEffect(activityPermissionGranted, isForeground) {',
              '        val sensorManager = context.getSystemService(Context.SENSOR_SERVICE) as SensorManager',
              '        val stepSensor = sensorManager.getDefaultSensor(Sensor.TYPE_STEP_COUNTER)',
              '        hasStepSensor = stepSensor != null',
              '        val listener = object : SensorEventListener {',
              '            override fun onSensorChanged(event: SensorEvent) {',
              '                rawSensorSteps = event.values.firstOrNull() ?: -1f',
              '            }',
              '            override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) = Unit',
              '        }',
              '        if (',
              '            FitnessForegroundPolicy.shouldRegisterStepSensor(',
              '                isForeground = isForeground,',
              '                activityPermissionGranted = activityPermissionGranted,',
              '                hasStepSensor = stepSensor != null',
              '            ) && stepSensor != null',
              '        ) {',
              '            sensorManager.registerListener(listener, stepSensor, SensorManager.SENSOR_DELAY_NORMAL)',
              '        }',
              '        onDispose { sensorManager.unregisterListener(listener) }',
              '    }',
              ''
          ])
          new_sensor = '\n'.join([
              '    DisposableEffect(activityPermissionGranted, isForeground) {',
              '        val sensorManager = context.getSystemService(Context.SENSOR_SERVICE) as SensorManager',
              '        val counterSensor = sensorManager.getDefaultSensor(Sensor.TYPE_STEP_COUNTER)',
              '        val detectorSensor = sensorManager.getDefaultSensor(Sensor.TYPE_STEP_DETECTOR)',
              '        hasStepSensor = counterSensor != null',
              '        hasStepDetector = detectorSensor != null',
              '        val listener = object : SensorEventListener {',
              '            override fun onSensorChanged(event: SensorEvent) {',
              '                when (event.sensor.type) {',
              '                    Sensor.TYPE_STEP_COUNTER -> {',
              '                        rawSensorSteps = event.values.firstOrNull() ?: -1f',
              '                    }',
              '                    Sensor.TYPE_STEP_DETECTOR -> {',
              '                        if ((event.values.firstOrNull() ?: 0f) <= 0f || profile == null) return',
              '                        detectorSessionSteps = if (detectorSessionSteps == Long.MAX_VALUE) Long.MAX_VALUE else detectorSessionSteps + 1L',
              '                        lastDetectorStepEpochMs = System.currentTimeMillis()',
              '                        val observed = StepReconciler.observeDetectedSteps(stepLedger)',
              '                        if (observed != stepLedger) {',
              '                            stepLedger = observed',
              '                            fitnessStore.saveStepLedger(observed)',
              '                        }',
              '                    }',
              '                }',
              '            }',
              '            override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) = Unit',
              '        }',
              '        val shouldRegister = FitnessForegroundPolicy.shouldRegisterStepSensor(',
              '            isForeground = isForeground,',
              '            activityPermissionGranted = activityPermissionGranted,',
              '            hasStepSensor = counterSensor != null || detectorSensor != null',
              '        )',
              '        if (shouldRegister) {',
              '            counterSensor?.let { sensorManager.registerListener(listener, it, SensorManager.SENSOR_DELAY_NORMAL) }',
              '            detectorSensor?.let { sensorManager.registerListener(listener, it, SensorManager.SENSOR_DELAY_NORMAL) }',
              '        }',
              '        onDispose { sensorManager.unregisterListener(listener) }',
              '    }',
              ''
          ])
          replace_exact(old_sensor, new_sensor, 'sensor registration')

          replace_exact(
              '        val observed = StepReconciler.observeSensor(stepLedger, rawSensorSteps)\n',
              '        val observed = if (hasStepDetector) {\n            StepReconciler.observeCounterAnchor(stepLedger, rawSensorSteps)\n        } else {\n            StepReconciler.observeSensor(stepLedger, rawSensorSteps)\n        }\n',
              'counter reconciliation'
          )

          replace_exact(
              '        hasStepSensor = hasStepSensor,\n        activityPermissionGranted = activityPermissionGranted\n',
              '        hasStepSensor = hasStepSensor || hasStepDetector,\n        activityPermissionGranted = activityPermissionGranted\n',
              'tracking mode'
          )

          text = text.replace(
              'sensorStatusLabel(hasStepSensor, activityPermissionGranted)',
              'sensorStatusLabel(hasStepSensor || hasStepDetector, activityPermissionGranted)'
          )

          signature_old = '    hasStepSensor: Boolean,\n    activityPermissionGranted: Boolean,\n'
          signature_new = '    hasStepSensor: Boolean,\n    hasStepDetector: Boolean,\n    detectorSessionSteps: Long,\n    lastDetectorStepEpochMs: Long?,\n    activityPermissionGranted: Boolean,\n'
          replace_exact(signature_old, signature_new, 'screen signatures', count=2)

          pattern = re.compile(r'(?m)^(\s*)hasStepSensor = hasStepSensor,\n')
          matches = list(pattern.finditer(text))
          if len(matches) == 3:
              text = pattern.sub(
                  lambda m: (
                      f'{m.group(1)}hasStepSensor = hasStepSensor,\n'
                      f'{m.group(1)}hasStepDetector = hasStepDetector,\n'
                      f'{m.group(1)}detectorSessionSteps = detectorSessionSteps,\n'
                      f'{m.group(1)}lastDetectorStepEpochMs = lastDetectorStepEpochMs,\n'
                  ),
                  text
              )
          elif 'hasStepDetector = hasStepDetector,' not in text:
              raise SystemExit(f'screen call wiring: expected 3 matches, found {len(matches)}')

          replace_exact(
              '                DiagnosticLine("Direct sensor raw since boot", if (rawSensorSteps >= 0) rawSensorSteps.toLong().toString() else "Waiting")\n                DiagnosticLine("Direct sensor delta from character baseline", sensorDelta.toString())\n',
              '                DiagnosticLine("Immediate detector steps this session", detectorSessionSteps.toString())\n                DiagnosticLine("Last immediate detector event", lastDetectorStepEpochMs?.let { Instant.ofEpochMilli(it).toString() } ?: "Not yet")\n                DiagnosticLine("Direct sensor raw since boot", if (rawSensorSteps >= 0) rawSensorSteps.toLong().toString() else "Waiting")\n                DiagnosticLine("Direct sensor delta from character baseline", sensorDelta.toString())\n',
              'detector diagnostics counters'
          )

          replace_exact(
              '                DiagnosticLine("Hardware TYPE_STEP_COUNTER", if (hasStepSensor) "Available" else "Unavailable")\n',
              '                DiagnosticLine("Hardware TYPE_STEP_DETECTOR", if (hasStepDetector) "Available — immediate footfalls" else "Unavailable")\n                DiagnosticLine("Hardware TYPE_STEP_COUNTER", if (hasStepSensor) "Available — cumulative/backfill" else "Unavailable")\n',
              'detector data source'
          )

          replace_exact(
              '                Text("This screen intentionally exposes the separate counters while step reconciliation is being developed.")\n',
              '                Text("This screen exposes immediate detector footfalls separately from delayed cumulative and Health Connect totals.")\n',
              'diagnostics intro'
          )

          path.write_text(text)
          PY
          if ! git diff --quiet -- app/src/main/java/com/pathofthewild/game/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pathofthewild/game/MainActivity.kt
            git commit -m "Use step detector for immediate footfalls"
            git push origin HEAD:step-detector-live-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and unit test
        run: gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: path-of-the-wild-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
